[workspace]
authors = ["Troy Altus <altustd@gmail.com>"]
channels = ["conda-forge"]
name = "causal-inference-python-ebook"
platforms = ["osx-arm64", "win-64"]
version = "0.1.0"

[tasks]
setup      = "python -m ipykernel install --prefix=$PIXI_PROJECT_ROOT --name causal-inference --display-name 'Python (causal-inference)'"
render     = "JUPYTER_DATA_DIR=$PIXI_PROJECT_ROOT/share/jupyter QUARTO_PYTHON=$PIXI_PROJECT_ROOT/.pixi/envs/default/bin/python quarto render"
render-pdf = "JUPYTER_DATA_DIR=$PIXI_PROJECT_ROOT/share/jupyter QUARTO_PYTHON=$PIXI_PROJECT_ROOT/.pixi/envs/default/bin/python quarto render --to pdf"
preview    = "JUPYTER_DATA_DIR=$PIXI_PROJECT_ROOT/share/jupyter QUARTO_PYTHON=$PIXI_PROJECT_ROOT/.pixi/envs/default/bin/python quarto preview"

[dependencies]
python        = ">=3.12,<3.13"
numpy         = ">=1.26,<3"
scipy         = ">=1.12,<2"
matplotlib    = ">=3.8,<4"
plotly        = ">=5.20,<6"
pandas        = ">=2.1,<3"
scikit-learn  = ">=1.4,<2"
pymc          = ">=5.10,<6"
networkx      = ">=3.2,<4"
scikit-fuzzy  = ">=0.4,<1"
ipykernel     = ">=6.29,<7"
jupyter       = ">=1.0,<2"
jupyterlab    = ">=4.1,<5"
notebook      = ">=7.1,<8"
pyyaml        = ">=6.0,<7"

[pypi-dependencies]
pgmpy  = ">=0.1.25"
dowhy  = ">=0.11"
